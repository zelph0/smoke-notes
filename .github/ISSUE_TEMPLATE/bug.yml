name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to /tasks\n2. …"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (URL / environment / Sentry link)
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] A failing test reproduces the bug, then passes with the fix
        - [ ] …
    validations:
      required: true
